name: Deploy to GitHub Pages

on:
  push:
    branches: ["main"]

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 18
          cache: 'npm'
          cache-dependency-path: package-lock.json

      - name: Install dependencies
        run: npm ci --prefer-offline --no-audit

      - name: Build project
        env:
          GITHUB_PAGES: 'true'
          VITE_BACKEND_URL: 'https://darshana-backend.onrender.com'
          VITE_GEMINI_API_KEY: 'AIzaSyD5KR9lDnGNE7yiZoySZC0QNntBkN3WsBM'
          VITE_FIREBASE_API_KEY: 'AIzaSyBHwLKNj5CQrJDonqeq3EXzs-D1O1YlJMQ'
          VITE_FIREBASE_AUTH_DOMAIN: 'darshana-travel.firebaseapp.com'
          VITE_FIREBASE_PROJECT_ID: 'darshana-travel'
          VITE_FIREBASE_STORAGE_BUCKET: 'darshana-travel.firebasestorage.app'
          VITE_FIREBASE_MESSAGING_SENDER_ID: '1038207736988'
          VITE_FIREBASE_APP_ID: '1:1038207736988:web:8c4f3d5e9b2a1c6f7e8d9c0b1a2f3e4d'
          VITE_WEATHERAPI_KEY: 'd13b302943ea145c978ee50ee3a4cf63'
        run: npm run build --verbose

      - name: List dist contents
        run: ls -la dist/

      - name: Configure Pages
        uses: actions/configure-pages@v4

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: './dist'

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
